  <script>
    const tl = gsap.timeline({ paused: true });
    const money = (v) => 'Rp ' + Math.round(v).toLocaleString('id-ID');

    // the tap
    tl.fromTo('#tp-tap-ring', { opacity: 0, scale: 0.55 }, { opacity: 0.95, scale: 1, duration: 0.3, ease: 'power2.out' }, 0.34);
    tl.to('#tp-tap-ring', { opacity: 0, scale: 1.35, duration: 0.3, ease: 'power1.out' }, 0.66);
    tl.to('#tp-balance', { scale: 0.985, duration: 0.1, ease: 'power1.out' }, 0.42).to('#tp-balance', { scale: 1, duration: 0.16, ease: 'power1.out' }, 0.54);

    // sheet
    tl.fromTo('#tp-scrim', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, 0.7);
    tl.fromTo('#tp-sheet', { y: 430, opacity: 0 }, { y: 0, opacity: 1, duration: 0.62, ease: 'power3.out' }, 0.72);

    // typed amount: one character at a time
    tl.to('#tp-amount-value span', { opacity: 1, duration: 0.01, stagger: 0.15, ease: 'none' }, 1.82);

    // category
    tl.fromTo('#tp-cat-food', { backgroundColor: '#1c1c1c', color: '#a5a5ad', borderColor: 'rgba(255,255,255,0.08)' }, { backgroundColor: '#211537', color: '#c4b5fd', borderColor: '#7c3aed', duration: 0.22, ease: 'power2.out' }, 2.48);

    // save press, sheet clears
    tl.to('#tp-save', { scale: 0.965, duration: 0.09, ease: 'power1.out' }, 3.06).to('#tp-save', { scale: 1, duration: 0.14, ease: 'power1.out' }, 3.16);
    tl.to('#tp-sheet', { y: 430, opacity: 0, duration: 0.45, ease: 'power2.in' }, 3.24);
    tl.to('#tp-scrim', { opacity: 0, duration: 0.4, ease: 'power1.in' }, 3.24);

    // the numbers move
    // The ids resolve once the scene is mounted; guard so build-time ticks are safe.
    const rms = (window.__HF_RMS && window.__HF_RMS.values) || [];
    const fps = (window.__HF_RMS && window.__HF_RMS.fps) || 30;

    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };

    const bal = { v: 1245000 };
    tl.to(bal, {
      v: 1235000,
      duration: 0.5,
      ease: 'power2.out',
      onUpdate: () => setText('tp-balance-amount', money(bal.v)),
    }, 3.7);

    const spend = { v: 445000 };
    tl.to(spend, {
      v: 455000,
      duration: 0.5,
      ease: 'power2.out',
      onUpdate: () => setText('tp-spend', '-Rp. ' + Math.round(spend.v).toLocaleString('id-ID')),
    }, 3.78);

    const net = { v: 245000 };
    tl.to(net, {
      v: 235000,
      duration: 0.5,
      ease: 'power2.out',
      onUpdate: () => setText('tp-net', '+Rp ' + Math.round(net.v).toLocaleString('id-ID')),
    }, 3.84);

    // saved row lands
    tl.fromTo('#tp-recent .tp-recent-row:first-child', { opacity: 0, y: -10, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: 'power3.out' }, 3.58);

    // caption
    tl.fromTo('#tap-line1', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.5);
    tl.fromTo('#tap-line2', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.68);
    tl.fromTo('#tap-sub', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36, ease: 'power2.out' }, 1.0);
    tl.fromTo('#tap-note', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.2);

    // audio-reactive glow keeps the scene alive between steps
    for (let t = 0.2; t < 5.6; t += 0.1) {
      const v = rms[Math.round((6.1 + t) * fps)] || 0.35;
      tl.to('#tp-glow', { opacity: 0.18 + v * 0.26, duration: 0.1, ease: 'none' }, t);
    }

    tl.set('#tp-recent .tp-recent-row:first-child', { opacity: 0 }, 0);

    window.__timelines['tap'] = tl;
  </script>
</template>
